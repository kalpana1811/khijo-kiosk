<script>

  * { box-sizing: border-box; -webkit-user-select: none !important; user-select: none !important; -webkit-touch-callout: none !important; }
  body { margin: 0; padding: 0; background: #F5F0E8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #F5F0E8; }
  * { box-sizing: border-box; }
  #app { width: 1024px; height: 600px; margin: 0 auto; background: #F5F0E8; overflow: hidden; position: relative; }
  .overflow-y-auto, .overflow-x-auto { -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .overflow-x-auto { touch-action: pan-x; }

  /* Hide scrollbar but keep scrolling */
  .scroll-hide::-webkit-scrollbar { display: none; }
  .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
  .scroll-hide { touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch; }
  .overflow-y-auto, .overflow-x-auto { -webkit-overflow-scrolling: touch; touch-action: pan-x pan-y; }

  /* Card hover */
  .menu-card { transition: transform 0.15s ease, box-shadow 0.15s ease; }
  img { -webkit-user-drag: none; user-drag: none; pointer-events: none; }

  /* Button transitions */

  .btn-dark:hover { background: #1F2937 !important; }

  /* Glow pulse animation */
  @keyframes pulse-glow {
    0%, 100% { transform: scale(1); opacity: 0.7; }
    50% { transform: scale(1.08); opacity: 1; }
  }
  .glow-ring { animation: pulse-glow 2s ease-in-out infinite; }

  /* Add button flash */
  @keyframes added-flash {
    0% { background: #22C55E; transform: scale(0.95); }
    100% { background: #22C55E; transform: scale(1); }
  }
  .btn-added { animation: added-flash 0.2s ease; background: #22C55E !important; }

  /* Fade in screen */
  @keyframes fade-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .screen-enter { animation: fade-in 0.25s ease; }

  /* Dot animation */
  @keyframes dot-bounce {
    0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }
  .dot1 { animation: dot-bounce 1.2s ease-in-out infinite; }
  .dot2 { animation: dot-bounce 1.2s ease-in-out 0.2s infinite; }

// Inject Unsplash images into any list of dish objects
function applyImages(dishes) {
  if (!dishes) return dishes;
  return dishes.map(d => ({
    ...d,
    image: DISH_PHOTOS[d.name] || d.image || CATEGORY_PHOTOS[d.category] || ''
  }));
}

// ─── State ────────────────────────────────────────────────────────────────
const state = {
  screen: 'welcome',   // welcome | greeting | menu | fullmenu | cart | orderPlaced
  session: null,
  cart: [],            // [{dish, qty}]
  orderNumber: null,
  fullMenuCat: null,
  rfidPolling: false,
};

// ─── API ──────────────────────────────────────────────────────────────────
async function fetchSession(uid=null) {
  const url = uid ? `/api/session/${uid}` : '/api/session';
  const r = await fetch(url);
  const sess = await r.json();
  if (sess && sess.status === 'ok') {
    sess.recommendations = applyImages(sess.recommendations);
    sess.safe_menu       = applyImages(sess.safe_menu);
    sess.all_menu        = applyImages(sess.all_menu);
    if (sess.surprise)    sess.surprise   = { ...sess.surprise,   image: DISH_PHOTOS[sess.surprise.name]   || CATEGORY_PHOTOS[sess.surprise.category]   || sess.surprise.image   || '' };
    if (sess.last_order)  sess.last_order = { ...sess.last_order, image: DISH_PHOTOS[sess.last_order.name] || CATEGORY_PHOTOS[sess.last_order.category] || sess.last_order.image || '' };
  }
  return sess;
}

// ─── Cart helpers ─────────────────────────────────────────────────────────
function cartCount() { return state.cart.reduce((s,i)=>s+i.qty,0); }
function cartTotal() { return state.cart.reduce((s,i)=>s+i.dish.price*i.qty,0); }
function cartAdd(dish) {
  const ex = state.cart.find(i=>i.dish.name===dish.name);
  if (ex) ex.qty++; else state.cart.push({dish, qty:1});
}
function cartUpdate(name, delta) {
  const i = state.cart.findIndex(x=>x.dish.name===name);
  if (i<0) return;
  state.cart[i].qty += delta;
  if (state.cart[i].qty <= 0) state.cart.splice(i,1);
}

// ─── Render ───────────────────────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  app.innerHTML = '';
  const screen = document.createElement('div');
  screen.className = 'w-full h-full screen-enter';

  if (state.screen === 'welcome')      renderWelcome(screen);
  else if (state.screen === 'greeting') renderGreeting(screen);
  else if (state.screen === 'menu')    renderMenu(screen);
  else if (state.screen === 'fullmenu') renderFullMenu(screen);
  else if (state.screen === 'cart')    renderCart(screen);
  else if (state.screen === 'orderPlaced') renderOrderPlaced(screen);

  app.appendChild(screen);
  setTimeout(initScroll, 30);
}

          </svg>

      <button onclick="guestLogin()" style="font-size:1rem;color:#8B6F47;text-decoration:underline;background:none;border:none;cursor:pointer;padding:4px 0" onmouseover="this.style.color='#6D5737'" onmouseout="this.style.color='#8B6F47'">
        I don't have Aller card
      </button>
    </div>
  </div>`;

  const guestBtn = document.getElementById('guest-btn');
  if (guestBtn) {
    guestBtn.onclick = async () => {
      try {
        const sess = await fetchSession('1047571399431');
        if (sess && sess.status === 'ok') { state.session = sess; goGreeting(); }
      } catch(e) {
        console.error('Session fetch failed:', e);
      }
    };
  }

  // Start RFID polling
  if (!state.rfidPolling) {
    state.rfidPolling = true;
    pollRFID();
  }
}

async function pollRFID() {
  if (state.screen !== 'welcome') { state.rfidPolling = false; return; }
  try {
    const sess = await fetchSession();
    // Only advance if we got a real card scan (status ok AND uid looks like real RFID)
    if (sess && sess.status === 'ok' && sess.uid) {
      state.rfidPolling = false;
      state.session = sess;
      goGreeting();
      return;
    }
  } catch(e) {
    // Network error or server error — just keep polling
  }
  setTimeout(pollRFID, 1000);
}

function goGreeting() {
  state.screen = 'greeting';
  render();
  // Re-fetch full enriched session while greeting shows, then go to menu
  const uid = state.session && state.session.uid ? state.session.uid : '100001';
  fetchSession(uid).then(sess => {
    if (sess && sess.status === 'ok') state.session = sess;
  }).catch(e => console.error('session enrich error:', e)).finally(() => {
    setTimeout(() => { state.screen = 'menu'; render(); }, 2200);
  });
}

                || state.session?.safe_menu?.find(d=>d.name===btn.dataset.name)
                || state.session?.recommendations?.find(d=>d.name===btn.dataset.name)
                || {name:btn.dataset.name, allergens:[], avoid_tags:[], ingredients:[]};
      showIngredientsModal(dish);
    };
  });
}

// ─── DERIVE INGREDIENTS FROM DISH NAME + ALLERGENS ──────────────────────────
function getIngredients(dish) {
  const n = (dish.name || '').toLowerCase();
  const allergens = dish.allergens || [];
  const ingr = new Set();

  // Noodle base
  if (n.includes('udon'))                          ingr.add('udon noodles');
  else if (n.includes('ramen') || n.includes('noodle soup')) ingr.add('ramen noodles');
  else if (n.includes('yakisoba'))                 ingr.add('yakisoba noodles');
  if (n.includes('noodle') || n.includes('ramen') || n.includes('udon') || n.includes('yakisoba')) {
    ingr.add('dashi broth'); ingr.add('soy sauce'); ingr.add('mirin'); ingr.add('sesame oil'); ingr.add('spring onion');
  }

  // Rice
  if (n.includes('rice bowl') || n.includes('teriyaki rice') || n.includes('curry rice') || n.includes('fried rice')) {
    ingr.add('steamed jasmine rice'); ingr.add('sesame seeds');
  }
  if (n.includes('fried rice')) { ingr.add('egg'); ingr.add('soy sauce'); ingr.add('spring onion'); ingr.add('vegetable oil'); }

  // Buns / Momos
  if (n.includes('momo') || n.includes('bun')) {
    ingr.add('steamed wheat bun dough'); ingr.add('garlic'); ingr.add('ginger'); ingr.add('soy sauce');
  }

  // Hotpot
  if (n.includes('hotpot')) {
    ingr.add('spicy broth'); ingr.add('chilli oil'); ingr.add('garlic'); ingr.add('ginger'); ingr.add('soy sauce'); ingr.add('spring onion'); ingr.add('tofu'); ingr.add('mushrooms'); ingr.add('pak choi');
  }

  // Gyoza
  if (n.includes('gyoza')) {
    ingr.add('gyoza wrapper'); ingr.add('cabbage'); ingr.add('garlic'); ingr.add('ginger'); ingr.add('soy sauce'); ingr.add('sesame oil');
  }

  // Spring rolls
  if (n.includes('spring roll')) {
    ingr.add('spring roll wrapper'); ingr.add('glass noodles'); ingr.add('carrot'); ingr.add('cabbage'); ingr.add('soy sauce');
  }

  // Tempura
  if (n.includes('tempura')) {
    ingr.add('tempura batter'); ingr.add('wheat flour'); ingr.add('cold sparkling water'); ingr.add('vegetable oil');
  }

  // Katsu
  if (n.includes('katsu')) {
    ingr.add('panko breadcrumbs'); ingr.add('katsu curry sauce'); ingr.add('onion'); ingr.add('potato'); ingr.add('carrot'); ingr.add('vegetable oil');
  }

  // Teriyaki sauce
  if (n.includes('teriyaki')) {
    ingr.add('teriyaki sauce'); ingr.add('mirin'); ingr.add('sake'); ingr.add('soy sauce');
  }

  // Curry
  if (n.includes('curry')) {
    ingr.add('curry sauce'); ingr.add('onion'); ingr.add('potato'); ingr.add('carrot'); ingr.add('garam masala');
  }

  // Spicy / chilli
  if (n.includes('spicy') || n.includes('chilli')) {
    ingr.add('chilli paste'); ingr.add('chilli oil'); ingr.add('garlic');
  }

  // Miso
  if (n.includes('miso')) { ingr.add('white miso paste'); ingr.add('dashi'); }

  // Proteins
  if (n.includes('beef'))    { ingr.add('beef'); ingr.add('soy marinade'); }
  if (n.includes('chicken')) { ingr.add('chicken'); ingr.add('garlic'); }
  if (n.includes('pork'))    { ingr.add('pork'); ingr.add('ginger'); ingr.add('soy sauce'); }
  if (n.includes('lamb'))    { ingr.add('lamb'); ingr.add('cumin'); ingr.add('coriander'); }
  if (n.includes('duck'))    { ingr.add('duck'); ingr.add('hoisin sauce'); ingr.add('five spice'); }
  if (n.includes('salmon'))  { ingr.add('salmon fillet'); ingr.add('teriyaki glaze'); }
  if (n.includes('prawn') || n.includes('shrimp')) { ingr.add('king prawns'); ingr.add('garlic butter'); }
  if (n.includes('seafood')) { ingr.add('mixed seafood'); ingr.add('squid'); ingr.add('prawns'); ingr.add('scallops'); }
  if (n.includes('tofu'))    { ingr.add('firm tofu'); ingr.add('soy sauce'); }
  if (n.includes('halloumi')){ ingr.add('halloumi cheese'); ingr.add('mint'); ingr.add('lemon'); }
  if (n.includes('mushroom') || n.includes('fungi')) { ingr.add('shiitake mushrooms'); ingr.add('oyster mushrooms'); }
  if (n.includes('pumpkin')) { ingr.add('pumpkin'); ingr.add('miso glaze'); }
  if (n.includes('edamame')) { ingr.add('edamame beans'); ingr.add('sea salt'); }

  // Veg generic
  if (n.includes('vegetable') || n.includes('veg ') || n.includes('veg+')) {
    ingr.add('mixed seasonal vegetables'); ingr.add('spring onion'); ingr.add('garlic');
  }

  // Egg
  if (n.includes('tea egg'))     { ingr.add('egg'); ingr.add('soy sauce'); ingr.add('five spice'); ingr.add('black tea'); }
  if (n.includes('braised egg')) { ingr.add('egg'); ingr.add('soy sauce'); ingr.add('mirin'); ingr.add('sake'); }

  // Drinks
  if (n.includes('drink'))       { ingr.add('choice of soft drink'); }
  if (n.includes('green tea'))   { ingr.add('green tea leaves'); ingr.add('hot water'); }
  if (n.includes('mango'))       { ingr.add('mango juice'); ingr.add('sugar'); ingr.add('ice'); }
  if (n.includes('lemonade'))    { ingr.add('lemon juice'); ingr.add('sugar syrup'); ingr.add('sparkling water'); }
  if (n.includes('cola') || n.includes('soda')) { ingr.add('carbonated soft drink'); }
  if (n.includes('juice'))       { ingr.add('fresh fruit juice'); }

  // Sides
  if (n.includes('rice') && ingr.size === 0) { ingr.add('steamed jasmine rice'); }

  // Always add allergens as explicit items if not already implied
  if (allergens.includes('peanuts') && !Array.from(ingr).some(i => i.includes('peanut'))) ingr.add('peanut sauce');
  if (allergens.includes('dairy')   && !Array.from(ingr).some(i => i.includes('butter') || i.includes('cream') || i.includes('cheese'))) ingr.add('dairy');
  if (allergens.includes('sesame')  && !Array.from(ingr).some(i => i.includes('sesame'))) ingr.add('sesame oil');
  if (allergens.includes('fish')    && !Array.from(ingr).some(i => i.includes('fish'))) ingr.add('fish sauce');
  if (allergens.includes('shellfish') && !Array.from(ingr).some(i => i.includes('prawn') || i.includes('seafood'))) ingr.add('shellfish');
  if (allergens.includes('mustard') && !Array.from(ingr).some(i => i.includes('mustard'))) ingr.add('mustard');
  if (allergens.includes('celery')  && !Array.from(ingr).some(i => i.includes('celery'))) ingr.add('celery');

  const result = Array.from(ingr);
  return result.length > 0 ? result : ['rice', 'soy sauce', 'sesame oil', 'spring onion'];
}

// ─── INGREDIENTS MODAL ────────────────────────────────────────────────────
function showIngredientsModal(dish) {
  const userAllergens = state.session?.user?.allergies || [];
  const dishAllergens = dish.allergens || [];
  const ingredients = getIngredients(dish);

  // Render each ingredient — highlight if it maps to a known allergen
  const allergenKeywords = {
    'gluten': ['wheat','flour','noodle','dough','breadcrumb','panko','udon','soy sauce','miso','teriyaki','yakisoba'],
    'soy': ['soy','miso','tofu','edamame','teriyaki','yakisoba'],
    'eggs': ['egg','mayonnaise','katsu'],
    'peanuts': ['peanut'],
    'dairy': ['butter','cream','cheese','milk','halloumi'],
    'sesame': ['sesame'],
    'fish': ['fish','dashi','anchovy'],
    'shellfish': ['prawn','shrimp','crab','lobster','seafood'],
    'celery': ['celery'],
    'mustard': ['mustard'],
    'sulphites': ['wine','vinegar','dried fruit'],
  };

  function isAllergenIngredient(ingredient) {
    const lower = ingredient.toLowerCase();
    for (const [allergen, keywords] of Object.entries(allergenKeywords)) {
      if (dishAllergens.includes(allergen) && keywords.some(k => lower.includes(k))) {
        return allergen;
      }
    }
    return null;
  }

  const ingredientHTML = ingredients.length > 0
    ? ingredients.map(ing => {
        const allergen = isAllergenIngredient(ing);
        const isMyAllergen = allergen && userAllergens.includes(allergen);
        const isOtherAllergen = allergen && !isMyAllergen;
        if (isMyAllergen) {
          return '<span class="px-2 py-0.5 bg-red-100 text-red-700 rounded-md text-sm font-semibold border border-red-200">⚠ ' + ing + '</span>';
        } else if (isOtherAllergen) {
          return '<span class="px-2 py-0.5 bg-amber-50 text-amber-800 rounded-md text-sm border border-amber-200">' + ing + '</span>';
        }
        return '<span class="px-2 py-0.5 bg-white text-gray-700 rounded-md text-sm border border-gray-200">' + ing + '</span>';
      }).join('')
    : '<p class="text-gray-500 text-sm">Please ask staff for full ingredient list</p>';

  const myAllergens = dishAllergens.filter(a => userAllergens.includes(a));
  const warningHTML = myAllergens.length > 0
    ? `<div class="bg-red-50 border border-red-200 rounded-xl p-3 mb-4 flex items-center gap-2">
        <span class="text-red-600 font-bold">⚠</span>
        <span class="text-red-700 text-sm font-medium">Contains your allergens: ${myAllergens.join(', ')}</span>
      </div>`
    : `<div class="bg-green-50 border border-green-200 rounded-xl p-3 mb-4 flex items-center gap-2">
        <span class="text-green-600">✓</span>
        <span class="text-green-700 text-sm font-medium">Safe for your allergies</span>
      </div>`;

  const overlay = document.createElement('div');
  overlay.className = 'fixed inset-0 bg-black/40 flex items-center justify-center z-50';
  overlay.innerHTML = `
  <div class="bg-[#F5F0E8] rounded-2xl p-6 shadow-2xl" style="width:440px;max-height:80vh;display:flex;flex-direction:column">
    <h3 class="text-xl font-bold mb-1">${dish.name}</h3>
    <p class="text-sm text-gray-500 mb-4">£${dish.price?.toFixed(2) || ''}</p>
    ${warningHTML}
    <p class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2">Ingredients</p>
    <div class="flex flex-wrap gap-1.5 overflow-y-auto mb-4" style="max-height:220px">
      ${ingredientHTML}
    </div>
    <div class="flex gap-2 text-xs text-gray-400 mb-4">
      <span class="px-2 py-0.5 bg-red-100 text-red-600 rounded border border-red-200">⚠ your allergen</span>
      <span class="px-2 py-0.5 bg-amber-50 text-amber-700 rounded border border-amber-200">other allergen</span>
      <span class="px-2 py-0.5 bg-white text-gray-500 rounded border border-gray-200">safe</span>
    </div>
    <button class="close-modal w-full py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition-colors">Close</button>
  </div>`;
  document.getElementById('app').appendChild(overlay);
  overlay.querySelector('.close-modal').onclick = () => overlay.remove();
  overlay.onclick = (e) => { if(e.target===overlay) overlay.remove(); };
}

// ─── Get reasons why dish is unsafe for this user ───────────────────────────
function getUnsafeReasons(dish, session) {
  if (!session || !dish) return 'allergen';
  const userAllergens = session.user?.allergies || [];
  const userAvoid = session.user?.avoid || session.user?.avoid_tags || [];
  const dietPrefs = session.user?.dietary_preferences || [];
  
  const reasons = [];
  
  // Check allergens
  const dishAllergens = dish.allergens || [];
  const matchedAllergens = dishAllergens.filter(a => userAllergens.includes(a));
  if (matchedAllergens.length > 0) reasons.push(...matchedAllergens);
  
  // Check avoid tags
  const dishAvoid = dish.avoid_tags || [];
  const matchedAvoid = dishAvoid.filter(t => userAvoid.includes(t));
  if (matchedAvoid.length > 0) reasons.push(...matchedAvoid);
  
  // Check dietary
  if (dietPrefs.includes('vegetarian') && dish.diet_tag === 'non-vegetarian') reasons.push('meat');
  if (dietPrefs.includes('vegan') && dish.diet_tag !== 'vegan') reasons.push('animal products');
  if (dietPrefs.includes('halal') && !dish.halal) reasons.push('not halal');
  
  return reasons.length > 0 ? reasons.join(', ') : 'allergen';
}

function initScroll() {
  // Use mousemove on document so drag works even if finger moves off element
  let dragEl = null, axis = 'x', startPos = 0, startScroll = 0;

  document.addEventListener('mousedown', e => {
    const horiz = e.target.closest('.overflow-x-auto');
    const vert  = e.target.closest('#menu-scroll');
    if (e.target.closest('button')) return;
    if (horiz) { dragEl = horiz; axis = 'x'; startPos = e.clientX; startScroll = horiz.scrollLeft; }
    else if (vert) { dragEl = vert; axis = 'y'; startPos = e.clientY; startScroll = vert.scrollTop; }
  });

  document.addEventListener('mousemove', e => {
    if (!dragEl) return;
    if (axis === 'x') dragEl.scrollLeft = startScroll + (startPos - e.clientX);
    else dragEl.scrollTop = startScroll + (startPos - e.clientY);
  });

  document.addEventListener('mouseup', () => { dragEl = null; });

  // Touch events for actual touchscreen
  document.addEventListener('touchstart', e => {
    const horiz = e.target.closest('.overflow-x-auto');
    const vert  = e.target.closest('#menu-scroll');
    if (e.target.closest('button')) return;
    if (horiz) { dragEl = horiz; axis = 'x'; startPos = e.touches[0].clientX; startScroll = horiz.scrollLeft; }
    else if (vert) { dragEl = vert; axis = 'y'; startPos = e.touches[0].clientY; startScroll = vert.scrollTop; }
  }, {passive: true});

  document.addEventListener('touchmove', e => {
    if (!dragEl) return;
    if (axis === 'x') dragEl.scrollLeft = startScroll + (startPos - e.touches[0].clientX);
    else dragEl.scrollTop = startScroll + (startPos - e.touches[0].clientY);
  }, {passive: true});

  document.addEventListener('touchend', () => { dragEl = null; }, {passive: true});
}
